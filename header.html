<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <base target="_parent">

    <link rel="stylesheet" href="styles/index.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="styles/responsive-selects.css" rel="stylesheet" />

</head>

<body class="header-frame">

    <header class="site-header">

        <!-- ANNOUNCEMENT BAR -->
        <div class="announcement">

            <span>
                FREE SHIPPING OVER $150 — EXTENDED WITH 30 DAYS
            </span>

            <div class="announcement-right">

                <!-- LANGUAGE -->
                <div class="select-wrapper">

                    <i class="fa-solid fa-earth-americas"></i>

                    <select class="announcement-select" aria-label="Language">
                        <optgroup label="Language">
                            <option value="en" selected>English</option>
                            <option value="fr">French</option>
                            <option value="es">Spanish</option>
                            <option value="de">German</option>
                        </optgroup>
                    </select>

                    <i class="fa-solid fa-chevron-down select-arrow"></i>

                </div>


                <!-- CURRENCY -->
                <div class="select-wrapper">

                    <select class="announcement-select" aria-label="Currency">
                        <optgroup label="Currency">
                            <option value="usd" selected>$ USD</option>
                            <option value="eur">€ EUR</option>
                            <option value="gbp">£ GBP</option>
                            <option value="ngn">₦ NGN</option>
                        </optgroup>
                    </select>

                    <i class="fa-solid fa-chevron-down select-arrow"></i>

                </div>

            </div>

        </div>


        <!-- NAVIGATION -->
        <nav class="nav">

            <!-- LEFT -->
            <div class="nav-left">

                <!-- MOBILE HAMBURGER -->
                <button aria-label="Open menu" aria-expanded="false" class="mobile-menu" type="button">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <!-- NAV LINKS -->
                <ul class="nav-links">

                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="shop.html">Category</a>
                    </li>

                    <li>
                        <a href="clothing.html">Clothing</a>
                    </li>

                    <li>
                        <a href="bag.html">Bags</a>
                    </li>

                    <li>
                        <a href="shoe.html">Shoes</a>
                    </li>

                    <li>
                        <a href="accessories.html">Accessories</a>
                    </li>

                    <li>
                        <a href="aboutus.html">Information</a>
                    </li>

                    <li>
                        <a href="contactus.html">Contact</a>
                    </li>

                </ul>

            </div>


            <!-- LOGO -->
            <a class="logo" href="index.html">
                CYNT
            </a>


            <!-- RIGHT -->
            <div class="nav-actions">

                <!-- SEARCH -->
                <label class="search">

                    <span>
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>

                    <input type="search" placeholder="Search">

                </label>


                <!-- WISHLIST -->
                <a aria-label="Wishlist" href="aboutus.html">

                    <i class="fa-regular fa-heart"></i>

                </a>


                <!-- CART -->
                <a aria-label="Shopping bag" href="checkout.html">

                    <i class="fa-solid fa-cart-shopping"></i>
                    Cart

                </a>


                <!-- LOGIN -->
                <a class="login" href="login.html">

                    <i class="fa-solid fa-user"></i>
                    Login

                </a>

            </div>

        </nav>

    </header>


    <!-- MOBILE MENU SCRIPT -->
    <script>
        const menuButton = document.querySelector(".mobile-menu");
        const navLinks = document.querySelector(".nav-links");
        const header = document.querySelector(".site-header");
        const frame = window.frameElement;

        function closeMenu() {
            document.body.classList.remove("menu-open");

            menuButton.setAttribute("aria-expanded", "false");
            menuButton.setAttribute("aria-label", "Open menu");

            menuButton.innerHTML = '<i class="fa-solid fa-bars"></i>';

            if (frame && window.innerWidth <= 700) {
                frame.style.height = "82px";
            }
        }

        function openMenu() {
            document.body.classList.add("menu-open");

            menuButton.setAttribute("aria-expanded", "true");
            menuButton.setAttribute("aria-label", "Close menu");

            menuButton.innerHTML = '<i class="fa-solid fa-xmark"></i>';

            if (frame) {
                // Wait for the menu to become visible
                requestAnimationFrame(() => {
                    const height = header.scrollHeight;
                    frame.style.height = height + "px";
                });
            }
        }

        menuButton.addEventListener("click", function () {
            const isOpen = document.body.classList.contains("menu-open");

            if (isOpen) {
                closeMenu();
            } else {
                openMenu();
            }
        });

        document.querySelectorAll(".nav-links a").forEach(link => {
            link.addEventListener("click", function () {
                closeMenu();
            });
        });

        window.addEventListener("resize", function () {
            if (window.innerWidth > 700) {
                document.body.classList.remove("menu-open");

                menuButton.setAttribute("aria-expanded", "false");
                menuButton.innerHTML = '<i class="fa-solid fa-bars"></i>';

                if (frame) {
                    frame.style.height = "";
                }
            }
        });
    </script>

</body>

</html>
